<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="240" viewBox="0 0 1500 240">
<rect width="1500" height="240" fill="#f8fafc"/>
<text x="24" y="35" font-family="Arial" font-size="23" fill="#14263b" font-weight="bold">Six-model B1 stack with calibrated threshold</text>
<rect x="24" y="65" width="226" height="110" rx="12" fill="#0e7490"/>
<text x="137" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Saved raw logits</text>
<text x="137" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Two scores per model</text>
<path d="M252 119 H266" stroke="#263447" stroke-width="3"/>
<rect x="270" y="65" width="226" height="110" rx="12" fill="#174ea6"/>
<text x="383" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Class-score margin</text>
<text x="383" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">class 1 minus class 0</text>
<path d="M498 119 H512" stroke="#263447" stroke-width="3"/>
<rect x="516" y="65" width="226" height="110" rx="12" fill="#6d28d9"/>
<text x="629" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">StandardScaler</text>
<text x="629" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Fit on train calibration</text>
<path d="M744 119 H758" stroke="#263447" stroke-width="3"/>
<rect x="762" y="65" width="226" height="110" rx="12" fill="#0e7490"/>
<text x="875" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">L2 logistic regression</text>
<text x="875" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Weighted standardized</text>
<text x="875" y="153" text-anchor="middle" font-family="Arial" font-size="14" fill="white">margins</text>
<path d="M990 119 H1004" stroke="#263447" stroke-width="3"/>
<rect x="1008" y="65" width="226" height="110" rx="12" fill="#174ea6"/>
<text x="1121" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Sigmoid + threshold</text>
<text x="1121" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Threshold 0.514611</text>
<path d="M1236 119 H1250" stroke="#263447" stroke-width="3"/>
<rect x="1254" y="65" width="226" height="110" rx="12" fill="#6d28d9"/>
<text x="1367" y="106" text-anchor="middle" font-family="Arial" font-size="16" fill="white">Case prediction</text>
<text x="1367" y="134" text-anchor="middle" font-family="Arial" font-size="14" fill="white">Integer label 0 or 1</text>
<text x="24" y="213" font-family="Arial" font-size="15" fill="#334155">Stored logistic coefficients multiply standardized margins; they do not multiply raw model probabilities.</text>
</svg>
