[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs781-phase1"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<2.6", "numpy", "tokenizers>=0.21,<0.22", "datasets>=3.6,<4", "huggingface_hub>=0.36,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
evaluation = ["bert-score==0.3.13", "transformers>=4.40,<5"]

[tool.setuptools.packages.find]
include = ["cs781*"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["gpu: requires CUDA", "integration: requires official data or scoring weights"]
